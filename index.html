<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060913">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Banner Notifica Nuovi Contenuti (Aggiunto per Avvio Istantaneo) -->
    <div class="toast-update" id="toast-update" onclick="applyPendingUpdates()" role="alert" aria-live="polite" style="display:none;">
        🔔 NUOVE NOTIZIE DISPONIBILI — CLICCA PER AGGIORNARE
    </div>

    <!-- Modale Ricerca -->
    <div class="modal-overlay" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title" onclick="closeModalOnOverlay(event, 'search-modal')">
        <div class="modal-body" onclick="event.stopPropagation()">
            <div class="modal-title" id="search-modal-title">CERCA NEL GIORNALE</div>
            <div class="filter-group">
                <input type="text" id="search" class="modal-select" placeholder="SCRIVI E CERCA..." aria-label="Cerca notizie o offerte" oninput="debounceRender()">
            </div>
            <button class="modal-action-btn" aria-label="Conferma ricerca" onclick="toggleSearchModal(false)">CERCA</button>
        </div>
    </div>

    <!-- Modale Filtri Piattaforma -->
    <div class="modal-overlay" id="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filter-modal-title" onclick="closeModalOnOverlay(event, 'filter-modal')">
        <div class="modal-body" onclick="event.stopPropagation()">
            <div class="modal-title" id="filter-modal-title">FILTRI PIATTAFORMA</div>
            <div class="filter-group">
                <select id="platform-filter" class="modal-select" aria-label="Seleziona piattaforma" onchange="renderVirtualDom()">
                    <option value="ALL">TUTTE LE PIATTAFORME</option>
                    <option value="PC">PC / STEAM</option>
                    <option value="PLAYSTATION">PLAYSTATION</option>
                    <option value="XBOX">XBOX</option>
                    <option value="NINTENDO">NINTENDO SWITCH</option>
                </select>
            </div>
            <button class="modal-action-btn" aria-label="Applica filtri" onclick="toggleFilterModal(false)">APPLICA</button>
        </div>
    </div>

    <!-- Pulsanti di Navigazione Laterali -->
    <button class="arrow-nav prev" id="arrow-prev" aria-label="Pagina precedente" onclick="prevPage()">❮</button>
    <button class="arrow-nav next" id="arrow-next" aria-label="Pagina successiva" onclick="nextPage()">❯</button>

    <!-- Viewport Principale -->
    <main class="newspaper-viewport" id="viewport" aria-label="Lettore notizie">
        <div class="newspaper-track" id="newspaper-track">
            <!-- Il contenuto verrà generato dinamicamente via JavaScript -->
            <div class="newspaper-page active">
                <div class="page-paper empty-state">
                    <h1 class="page-title">CARICAMENTO...</h1>
                    <p class="page-desc">SCARICAMENTO CONTENUTI IN CORSO.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Indicatori Pagine -->
    <div class="page-dots" id="page-dots" aria-label="Indicatori di pagina"></div>

    <!-- Pulsanti Fluttuanti Action -->
    <button class="floating-action-btn filter-float-btn" id="float-filter-btn" aria-label="Apri filtri piattaforma" onclick="toggleFilterModal(true)" title="FILTRI" style="display:none;">⚙️</button>
    <button class="floating-action-btn search-float-btn" aria-label="Apri ricerca nel giornale" onclick="toggleSearchModal(true)" title="CERCA">🔍</button>

    <!-- Navigazione Principale a Tab -->
    <nav aria-label="Navigazione principale">
        <button class="nav-btn active" id="tab-news" aria-label="Sezione News" title="NEWS" onclick="switchTab('news')">📰</button>
        <button class="nav-btn" id="tab-deals" aria-label="Sezione Offerte" title="OFFERTE" onclick="switchTab('deals')">🏷️</button>
        <button class="nav-btn" id="tab-saved" aria-label="Sezione Preferiti" title="PREFERITI" onclick="switchTab('saved')">⭐</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
