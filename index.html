<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --surface: #0f172a;
            --border: rgba(255, 255, 255, 0.1);
            --primary: #ccff00;
            --primary-glow: rgba(204, 255, 0, 0.15);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }
        
        body { 
            background: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            padding: 10px 14px; 
            background: rgba(3, 7, 18, 0.95); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            z-index: 100;
        }
        
        .logo { 
            background: #7c3aed; 
            width: 36px; height: 36px; 
            border-radius: 10px; 
            display: grid; 
            place-items: center; 
            font-size: 1.2rem; 
            flex-shrink: 0;
        }
        
        .search { 
            flex-grow: 1; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            color: #fff; 
            outline: none; 
            font-size: 0.8rem;
        }
        
        .btn-refresh { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: #fff; 
            width: 36px; height: 36px; 
            border-radius: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
            display: grid;
            place-items: center;
        }
        .btn-refresh svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; }
        .btn-refresh.spinning svg { animation: spin 0.8s linear infinite; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        main { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 12px; 
            padding-bottom: 90px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 12px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            overflow: hidden; 
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }
        
        .card-body { 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-tag { 
            font-size: 0.65rem; 
            font-weight: 800; 
            color: var(--primary); 
        }
        
        .star-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 2px;
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        .star-btn.active { opacity: 1; }

        .card-title { 
            font-size: 0.85rem; 
            font-weight: 800; 
            margin-bottom: 6px; 
            line-height: 1.25; 
        }
        
        .card-desc { 
            font-size: 0.75rem; 
            color: var(--text-sub); 
            text-transform: none !important; 
            line-height: 1.35; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        nav { 
            position: fixed; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid var(--border); 
            border-radius: 30px; 
            padding: 4px; 
            display: flex; 
            gap: 2px; 
            backdrop-filter: blur(12px); 
            z-index: 200;
            max-width: 95vw;
            overflow-x: auto;
        }
        
        .nav-btn { 
            background: none; 
            border: none; 
            color: var(--text-sub); 
            padding: 8px 12px; 
            font-weight: 800; 
            font-size: 0.62rem; 
            border-radius: 20px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .nav-btn.active { 
            background: var(--primary); 
            color: #000; 
        }

        .status-box { 
            text-align: center; 
            grid-column: 1 / -1; 
            padding: 40px 20px; 
            color: var(--text-sub); 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐤</div>
        <input type="text" id="search" class="search" placeholder="CERCA..." oninput="render()">
        <button class="btn-refresh" id="refresh-btn" onclick="manualRefresh()" title="AGGIORNA">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14.93-4M20 12a8 8 0 0 1-14.93 4M14 8h5V3M10 16H5v5"/></svg>
        </button>
    </header>

    <main>
        <div class="grid" id="grid">
            <div class="status-box">CARICAMENTO IN CORSO...</div>
        </div>
    </main>

    <nav>
        <button class="nav-btn active" id="tab-news" onclick="switchTab('news')">📰 NEWS FEED</button>
        <button class="nav-btn" id="tab-deals" onclick="switchTab('deals')">🏷️ OFFERTE</button>
        <button class="nav-btn" id="tab-saved-news" onclick="switchTab('saved-news')">⭐ NEWS PREFERITE</button>
        <button class="nav-btn" id="tab-saved-deals" onclick="switchTab('saved-deals')">🔥 OFFERTE PREFERITE</button>
    </nav>
