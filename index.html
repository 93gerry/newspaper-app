<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --surface: #0f172a;
            --border: rgba(255, 255, 255, 0.1);
            --primary: #ccff00;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }
        
        body { 
            background: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            padding: 10px 14px; 
            background: rgba(3, 7, 18, 0.95); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            z-index: 100;
        }
        
        .logo { 
            background: #7c3aed; 
            width: 36px; height: 36px; 
            border-radius: 10px; 
            display: grid; 
            place-items: center; 
            font-size: 1.2rem; 
            flex-shrink: 0;
        }
        
        .search { 
            flex-grow: 1; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            color: #fff; 
            outline: none; 
            font-size: 0.8rem;
        }
        
        .btn-refresh { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: #fff; 
            width: 36px; height: 36px; 
            border-radius: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
            display: grid;
            place-items: center;
        }

        main { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 12px; 
            padding-bottom: 90px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 12px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            overflow: hidden; 
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }
        
        .card-body { 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-tag { 
            font-size: 0.65rem; 
            font-weight: 800; 
            color: var(--primary); 
        }
        
        .star-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 2px;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        .star-btn.active {
            opacity: 1;
        }

        .card-title { 
            font-size: 0.85rem; 
            font-weight: 800; 
            margin-bottom: 6px; 
            line-height: 1.25; 
        }
        
        .card-desc { 
            font-size: 0.75rem; 
            color: var(--text-sub); 
            text-transform: none !important; 
            line-height: 1.35; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        nav { 
            position: fixed; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid var(--border); 
            border-radius: 30px; 
            padding: 4px; 
            display: flex; 
            gap: 4px; 
            backdrop-filter: blur(12px); 
            z-index: 200;
        }
        
        .nav-btn { 
            background: none; 
            border: none; 
            color: var(--text-sub); 
            padding: 8px 14px; 
            font-weight: 800; 
            font-size: 0.68rem; 
            border-radius: 20px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-btn.active { 
            background: var(--primary); 
            color: #000; 
        }

        .status-box { 
            text-align: center; 
            grid-column: 1 / -1; 
            padding: 40px 20px; 
            color: var(--text-sub); 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐤</div>
        <input type="text" id="search" class="search" placeholder="CERCA..." oninput="render()">
        <button class="btn-refresh" onclick="loadData()">🔄</button>
    </header>

    <main>
        <div class="grid" id="grid">
            <div class="status-box">CARICAMENTO IN CORSO...</div>
        </div>
    </main>

    <nav>
        <button class="nav-btn active" id="tab-news" onclick="switchTab('news')">📰 NEWS</button>
        <button class="nav-btn" id="tab-deals" onclick="switchTab('deals')">🏷️ OFFERTE</button>
        <button class="nav-btn" id="tab-saved" onclick="switchTab('saved')">⭐ PREFERITI</button>
    </nav>

    <script>
        const FEEDS = [
            { name: "IGN Italia", url: "https://it.ign.com/feed.xml" },
            { name: "Multiplayer", url: "https://multiplayer.it/feed/rss/news/" }
        ];

        let articles = [];
        let deals = [];
        let saved = JSON.parse(localStorage.getItem('np_saved_items') || '[]');
        let currentTab = 'news';

        async function fetchProxy(url) {
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];
            for (let p of proxies) {
                try {
                    let r = await fetch(p);
                    if (r.ok) {
                        let text = await r.text();
                        if (text && text.includes("<rss")) return text;
                    }
                } catch(e) {}
            }
            return null;
        }

        function parseXML(xmlStr, source) {
            if (!xmlStr) return [];
            try {
                let xml = new DOMParser().parseFromString(xmlStr, "text/xml");
                return Array.from(xml.querySelectorAll("item")).map(i => {
                    const link = (i.querySelector("link")?.textContent || "#").trim();
                    const title = (i.querySelector("title")?.textContent || "").replace(/<[^>]*>?/gm, '').trim();
                    const desc = (i.querySelector("description")?.textContent || "").replace(/<[^>]*>?/gm, '').slice(0, 90) + "...";
                    return {
                        id: link || title,
                        title: title,
                        link: link,
                        desc: desc,
                        source: source
                    };
                });
            } catch(e) { return []; }
        }

        async function loadData() {
            document.getElementById('grid').innerHTML = '<div class="status-box">CARICAMENTO IN CORSO...</div>';
            
            articles = [];
            deals = [];

            for (let f of FEEDS) {
                let xml = await fetchProxy(f.url);
                if (xml) articles.push(...parseXML(xml, f.name));
            }

            let dealsXml = await fetchProxy("https://www.instant-gaming.com/it/feed/rss/");
            if (dealsXml) deals = parseXML(dealsXml, "Instant Gaming");

            render();
        }

        function toggleSave(e, id) {
            e.preventDefault();
            e.stopPropagation();

            const pool = [...articles, ...deals, ...saved];
            const item = pool.find(i => i.id === id);
            if (!item) return;

            const idx = saved.findIndex(i => i.id === id);
            if (idx > -1) {
                saved.splice(idx, 1);
            } else {
                saved.push(item);
            }

            localStorage.setItem('np_saved_items', JSON.stringify(saved));
            render();
        }

        function switchTab(t) {
            currentTab = t;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            const q = document.getElementById('search').value.toLowerCase();
            
            let list = [];
            if (currentTab === 'news') list = articles;
            else if (currentTab === 'deals') list = deals;
            else if (currentTab === 'saved') list = saved;

            const filtered = list.filter(i => i.title.toLowerCase().includes(q));
            grid.innerHTML = "";

            if (filtered.length === 0) {
                let emptyText = "NESSUN ELEMENTO TROVATO.";
                if (currentTab === 'saved') emptyText = "NESSUN PREFERITO SALVATO.";
                grid.innerHTML = `<div class="status-box">${emptyText}</div>`;
                return;
            }

            filtered.forEach(item => {
                const isSaved = saved.some(s => s.id === item.id);
                
                const card = document.createElement('a');
                card.className = 'card';
                card.href = item.link;
                card.target = '_blank';
                card.innerHTML = `
                    <div class="card-body">
                        <div class="card-header">
                            <span class="card-tag">${item.source}</span>
                            <button class="star-btn ${isSaved ? 'active' : ''}" onclick="toggleSave(event, '${item.id}')">⭐</button>
                        </div>
                        <h2 class="card-title">${item.title}</h2>
                        <p class="card-desc">${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        loadData();
    </script>
</body>
</html>
