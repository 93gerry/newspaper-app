<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewsPaper">
    <meta name="theme-color" content="#030712">
    
    <title>NewsPaper 🐤 v13.0 Precision</title>
    <link id="apple-icon" rel="apple-touch-icon" href="">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- STILI GRAFICI PRECISION REFINED v13 -->
    <style>
        :root {
            --bg-base: #030712;
            --surface-glass: rgba(15, 23, 42, 0.85);
            --surface-card: rgba(15, 23, 42, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --nav-height: 46px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* HEADER SUPER COMPATTO */
        .top-bar { 
            flex-shrink: 0;
            z-index: 800; 
            background: rgba(3, 7, 18, 0.92); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass); 
            padding: 6px 10px;
            padding-top: calc(env(safe-area-inset-top, 14px) + 3px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo { 
            background: linear-gradient(135deg, #7c3aed, #5b21b6); 
            width: 32px; height: 32px; 
            border-radius: 9px; 
            display: grid; place-items: center; 
            font-size: 1rem; 
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(124, 58, 237, 0.3); 
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-glass);
            padding: 6px 10px 6px 32px;
            border-radius: 9px;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
            font-family: inherit;
        }
        .search-input:focus { border-color: rgba(245, 158, 11, 0.4); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 0.75rem; }

        .action-icon-btn {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 32px; height: 32px;
            border-radius: 9px;
            display: grid; place-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .action-icon-btn:active { transform: scale(0.9); }
        .action-icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .action-icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
        .action-icon-btn.active-notif { color: var(--primary); border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.1); }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .filter-badge-btn {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--primary);
            padding: 0 9px;
            height: 32px;
            border-radius: 9px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .filter-badge-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* CONTENUTO SCORRIBILE MASSIMIZZATO */
        .scrollable-content {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
            padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 12px) + 16px);
        }

        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; max-width: 1100px; margin: 0 auto; }

        .card { 
            background: var(--surface-card); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            cursor: pointer; color: inherit; text-decoration: none; 
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .card:active { transform: scale(0.97); }

        .card-cover { width: 100%; height: 140px; position: relative; background: #0b0f19; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }

        .card-badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
        .source-tag { 
            background: rgba(3, 7, 18, 0.85); 
            backdrop-filter: blur(6px); 
            padding: 3px 7px; 
            border-radius: 5px; 
            font-size: 0.6rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            border: 1px solid rgba(255,255,255,0.08); 
        }
        .new-tag { background: #ef4444; color: #fff; padding: 2px 5px; border-radius: 5px; font-size: 0.58rem; font-weight: 800; }

        .card-body { padding: 10px 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 0.9rem; font-weight: 700; line-height: 1.25; margin-bottom: 5px; color: var(--text-main); letter-spacing: -0.2px; }
        .card-snippet { font-size: 0.75rem; color: var(--text-sub); line-height: 1.3; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .card-footer { font-size: 0.65rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-glass); padding-top: 8px; margin-top: auto; }

        .bookmark-btn { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid var(--border-glass); 
            width: 28px; height: 28px; 
            border-radius: 7px; 
            font-size: 0.8rem; cursor: pointer; 
            display: grid; place-items: center; 
            opacity: 0.4; filter: grayscale(0.8);
            transition: all 0.2s;
        }
        .bookmark-btn.active { opacity: 1; filter: grayscale(0); background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); }

        /* NAVIGAZIONE IN BASSO MICRO-COMPATTA */
        .bottom-nav-wrapper {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 8px) + 4px);
            left: 0; width: 100%;
            display: flex; justify-content: center;
            z-index: 800;
            pointer-events: none;
            padding: 0 16px;
        }

        .bottom-nav { 
            pointer-events: auto;
            width: 100%; max-width: 230px;
            height: var(--nav-height); 
            background: rgba(15, 23, 42, 0.92); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 14px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            padding: 0 3px;
        }

        .nav-tab-btn { 
            display: flex; align-items: center; gap: 5px; 
            color: var(--text-sub); background: none; border: none; 
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase; cursor: pointer; 
            height: 34px; padding: 0 10px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .nav-tab-btn.active { color: var(--primary); background: rgba(245, 158, 11, 0.1); }
        .nav-tab-btn span:first-child { font-size: 0.9rem; }

        /* DRAWER MODALE FILTRI */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }

        .drawer-panel {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #0b0f19;
            border-top: 1px solid var(--border-glass);
            border-radius: 22px 22px 0 0;
            padding: 18px 14px calc(env(safe-area-inset-bottom, 16px) + 16px) 14px;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 80vh;
            overflow-y: auto;
        }
        .drawer-overlay.open .drawer-panel { transform: translateY(0); }

        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .drawer-title { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; color: #fff; }
        .drawer-close { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; font-size: 0.8rem; cursor: pointer; }

        .drawer-section-title { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-sub); margin-bottom: 6px; margin-top: 12px; }
        
        .drawer-chips-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .drawer-chip {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            padding: 9px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drawer-chip:active { transform: scale(0.96); }
        .drawer-chip.active { background: var(--primary); color: #030712; border-color: transparent; }
        .drawer-chip.full-width { grid-column: span 2; }

        .status-box { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-sub); }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--border-glass); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px auto; }
    </style>
</head>
<body>

    <div class="app-layout">
        
        <header class="top-bar">
            <div class="brand-logo">🐤</div>
            
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Cerca..." oninput="renderArticles()">
            </div>

            <button class="filter-badge-btn" onclick="toggleDrawer(true)">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .69.41 1.32 1.03 1.51h.09a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09c-.62.19-1.03.82-1.03 1.51z"/></svg>
                <span>FILTRI</span>
            </button>

            <button class="action-icon-btn" id="notif-btn" onclick="toggleNotifications()" title="Notifiche">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </button>

            <button class="action-icon-btn" id="refresh-btn" onclick="manualRefresh()" title="Aggiorna">
                <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14.93-4M20 12a8 8 0 0 1-14.93 4M14 8h5V3M10 16H5v5"/></svg>
            </button>
        </header>

        <main class="scrollable-content">
            <div class="news-grid" id="news-grid">
                <div class="status-box">
                    <div class="spinner"></div>
                    <p>Caricamento notizie...</p>
                </div>
            </div>
        </main>

        <div class="bottom-nav-wrapper">
            <nav class="bottom-nav">
                <button class="nav-tab-btn active" id="nav-home" onclick="switchTab('home')">
                    <span>📰</span>
                    <span>FEED</span>
                </button>
                <button class="nav-tab-btn" id="nav-saved" onclick="switchTab('saved')">
                    <span>⭐</span>
                    <span>PREFERITI</span>
                </button>
            </nav>
        </div>

    </div>

    <!-- DRAWER FILTRI -->
    <div class="drawer-overlay" id="filter-drawer" onclick="if(event.target === this) toggleDrawer(false)">
        <div class="drawer-panel">
            <div class="drawer-header">
                <h3 class="drawer-title">FILTRI E PIATTAFORME</h3>
                <button class="drawer-close" onclick="toggleDrawer(false)">✕</button>
            </div>

            <div class="drawer-section-title">SITI WEB</div>
            <div class="drawer-chips-grid">
                <button class="drawer-chip full-width active" data-type="all" data-val="all" onclick="applyFilter('all', 'all', this)">TUTTI I SITI</button>
                <button class="drawer-chip" data-type="source" data-val="IGN Italia" onclick="applyFilter('source', 'IGN Italia', this)">IGN ITALIA</button>
                <button class="drawer-chip" data-type="source" data-val="Multiplayer.it" onclick="applyFilter('source', 'Multiplayer.it', this)">MULTIPLAYER.IT</button>
                <button class="drawer-chip full-width" data-type="source" data-val="Everyeye.it" onclick="applyFilter('source', 'Everyeye.it', this)">EVERYEYE.IT</button>
            </div>

            <div class="drawer-section-title">PIATTAFORME GAMING</div>
            <div class="drawer-chips-grid">
                <button class="drawer-chip" data-type="platform" data-val="pc" onclick="applyFilter('platform', 'pc', this)">PC GAMING</button>
                <button class="drawer-chip" data-type="platform" data-val="playstation" onclick="applyFilter('platform', 'playstation', this)">PLAYSTATION</button>
                <button class="drawer-chip" data-type="platform" data-val="xbox" onclick="applyFilter('platform', 'xbox', this)">XBOX</button>
                <button class="drawer-chip" data-type="platform" data-val="nintendo" onclick="applyFilter('platform', 'nintendo', this)">NINTENDO</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT JS -->
    <script>
        function generateAppleIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180; canvas.height = 180;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#7c3aed';
            ctx.fillRect(0, 0, 180, 180);
            ctx.font = '100px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🐤', 90, 98);
            document.getElementById('apple-icon').href = canvas.toDataURL('image/png');
        }
        generateAppleIcon();

        const FEEDS = [
            { name: "IGN Italia", url: "https://it.ign.com/feed.xml", color: "#ef4444" },
            { name: "Multiplayer.it", url: "https://multiplayer.it/feed/rss/news/", color: "#f97316" },
            { name: "Everyeye.it", url: "https://www.everyeye.it/feed/feed_news_rss.asp", color: "#3b82f6" }
        ];

        const PLATFORM_KEYWORDS = {
            pc: ["pc", "steam", "epic games", "rtx", "gpu", "windows", "hardware"],
            playstation: ["playstation", "ps5", "ps4", "psvr", "sony"],
            xbox: ["xbox", "series x", "series s", "game pass", "microsoft"],
            nintendo: ["nintendo", "switch", "mario", "zelda", "pokemon"]
        };

        let allArticles = [];
        let savedArticles = JSON.parse(localStorage.getItem('np_bookmarks_v13') || '[]');
        let currentTab = 'home';
        let filterType = 'all'; 
        let filterValue = 'all';
        let notificationsActive = localStorage.getItem('np_notif_v13') === 'true';

        if(notificationsActive) {
            document.getElementById('notif-btn').classList.add('active-notif');
        }

        function toggleDrawer(open) {
            const drawer = document.getElementById('filter-drawer');
            if (open) drawer.classList.add('open');
            else drawer.classList.remove('open');
        }

        async function toggleNotifications() {
            const btn = document.getElementById('notif-btn');
            if (!notificationsActive) {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        notificationsActive = true;
                        btn.classList.add('active-notif');
                        localStorage.setItem('np_notif_v13', 'true');
                    } else {
                        alert("Permesso notifiche negato dal browser.");
                    }
                } else {
                    alert("Notifiche non supportate da questo dispositivo.");
                }
            } else {
                notificationsActive = false;
                btn.classList.remove('active-notif');
                localStorage.setItem('np_notif_v13', 'false');
            }
        }

        function cleanText(text) {
            if (!text) return "";
            const doc = new DOMParser().parseFromString(text, 'text/html');
            return doc.body.textContent || "";
        }

        function isNew(pubDate) {
            const diffMs = new Date() - new Date(pubDate);
            return (diffMs / (1000 * 60 * 60)) < 3;
        }

        function parseRawXML(xmlString, source) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            const items = Array.from(xmlDoc.querySelectorAll("item"));

            return items.map((item) => {
                const title = item.querySelector("title")?.textContent || "";
                let link = "";
                const linkEl = item.querySelector("link");
                if (linkEl) link = linkEl.textContent.trim();
                if (!link || link.startsWith("<")) {
                    const guidEl = item.querySelector("guid");
                    if (guidEl && guidEl.textContent.startsWith("http")) link = guidEl.textContent.trim();
                }

                const description = item.querySelector("description")?.textContent || "";
                const contentEncoded = item.getElementsByTagNameNS("*", "encoded")[0]?.textContent || "";
                const pubDate = item.querySelector("pubDate")?.textContent || "";
                const guid = item.querySelector("guid")?.textContent || link;

                let imgUrl = "";
                const mediaContent = item.getElementsByTagName("media:content")[0];
                const enclosure = item.querySelector("enclosure");
                const thumbnail = item.getElementsByTagName("media:thumbnail")[0];

                if (mediaContent && mediaContent.getAttribute("url")) {
                    imgUrl = mediaContent.getAttribute("url");
                } else if (enclosure && enclosure.getAttribute("url") && enclosure.getAttribute("type", "").includes("image")) {
                    imgUrl = enclosure.getAttribute("url");
                } else if (thumbnail && thumbnail.getAttribute("url")) {
                    imgUrl = thumbnail.getAttribute("url");
                } 
                
                if (!imgUrl) {
                    const rawHtmlToScan = contentEncoded || description;
                    if (rawHtmlToScan) {
                        const docHtml = new DOMParser().parseFromString(rawHtmlToScan, 'text/html');
                        const img = docHtml.querySelector('img');
                        if (img && img.src && img.src.startsWith('http')) imgUrl = img.src;
                    }
                }

                return {
                    id: guid + "_" + source.name,
                    source: source.name,
                    sourceColor: source.color,
                    title: cleanText(title),
                    link: link,
                    snippet: cleanText(description).slice(0, 100) + "...",
                    image: imgUrl,
                    date: new Date(pubDate)
                };
            }).filter(art => art.title && art.link);
        }

        async function fetchFeedOriginal(source) {
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(source.url)}`,
                `https://corsproxy.io/?url=${encodeURIComponent(source.url)}`
            ];

            for (let proxyUrl of proxies) {
                try {
                    const res = await fetch(proxyUrl);
                    if (res.ok) {
                        const text = await res.text();
                        if (text && (text.includes("<rss") || text.includes("<feed") || text.includes("<xml"))) {
                            const parsed = parseRawXML(text, source);
                            if (parsed.length > 0) return parsed;
                        }
                    }
                } catch (e) {}
            }
            return [];
        }

        function toggleBookmark(e, artId) {
            e.stopPropagation();
            e.preventDefault();
            
            const article = allArticles.find(a => a.id === artId) || savedArticles.find(a => a.id === artId);
            if (!article) return;

            const index = savedArticles.findIndex(a => a.id === artId);
            if (index > -1) savedArticles.splice(index, 1);
            else savedArticles.push(article);

            localStorage.setItem('np_bookmarks_v13', JSON.stringify(savedArticles));
            renderArticles();
        }

        async function manualRefresh() {
            const btn = document.getElementById('refresh-btn');
            btn.classList.add('spinning');
            await loadAllNews();
            setTimeout(() => btn.classList.remove('spinning'), 500);
        }

        async function loadAllNews() {
            try {
                const results = await Promise.all(FEEDS.map(feed => fetchFeedOriginal(feed)));
                let freshArticles = results.flat();
                if (freshArticles.length > 0) {
                    allArticles = freshArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
                }
            } catch (err) {}
            renderArticles();
        }

        function applyFilter(type, value, element) {
            filterType = type;
            filterValue = value;
            document.querySelectorAll('.drawer-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            toggleDrawer(false);
            renderArticles();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab-btn').forEach(i => i.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            renderArticles();
        }

        function isPlatformMatch(article, platform) {
            const keywords = PLATFORM_KEYWORDS[platform] || [];
            const textToSearch = (article.title + " " + article.snippet).toLowerCase();
            return keywords.some(kw => textToSearch.includes(kw));
        }

        function renderArticles() {
            const grid = document.getElementById("news-grid");
            const searchQuery = document.getElementById("search-input").value.toLowerCase();
            
            let targetList = (currentTab === 'saved') ? savedArticles : allArticles;

            const filtered = targetList.filter(art => {
                const matchesSearch = art.title.toLowerCase().includes(searchQuery) || art.snippet.toLowerCase().includes(searchQuery);
                let matchesFilter = true;
                if (filterType === 'source') matchesFilter = art.source === filterValue;
                else if (filterType === 'platform') matchesFilter = isPlatformMatch(art, filterValue);

                return matchesSearch && matchesFilter;
            });

            grid.innerHTML = "";

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="status-box">
                        <p>${currentTab === 'saved' ? 'NESSUN ARTICOLO SALVATO.' : 'NESSUN ARTICOLO TROVATO.'}</p>
                        <button onclick="manualRefresh()" style="margin-top:10px; padding: 7px 14px; background:var(--primary); border:none; border-radius:8px; font-weight:800; font-size:0.75rem; text-transform:uppercase; color:#030712; cursor:pointer;">AGGIORNA ORA</button>
                    </div>`;
                return;
            }

            filtered.forEach(art => {
                const isSaved = savedArticles.some(s => s.id === art.id);
                const dateObj = new Date(art.date);
                const dateStr = isNaN(dateObj) ? "" : dateObj.toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                const showNewBadge = isNew(art.date);

                const card = document.createElement("a");
                card.className = "card";
                card.href = art.link;
                card.target = "_blank";
                card.rel = "noopener noreferrer";

                const coverHTML = art.image ? `
                    <div class="card-cover">
                        <img class="card-img" src="${art.image}" alt="" loading="lazy">
                        <div class="card-badges">
                            <span class="source-tag" style="color: ${art.sourceColor}">${art.source}</span>
                            ${showNewBadge ? `<span class="new-tag">NEW</span>` : ''}
                        </div>
                    </div>` : `
                    <div class="card-badges" style="position:relative; top:0; left:0; padding: 10px 10px 0 10px;">
                        <span class="source-tag" style="color: ${art.sourceColor}">${art.source}</span>
                        ${showNewBadge ? `<span class="new-tag">NEW</span>` : ''}
                    </div>`;

                card.innerHTML = `
                    ${coverHTML}
                    <div class="card-body">
                        <h2 class="card-title">${art.title}</h2>
                        <p class="card-snippet">${art.snippet}</p>
                        <div class="card-footer">
                            <span>🕒 ${dateStr}</span>
                            <button class="bookmark-btn ${isSaved ? 'active' : ''}" onclick="toggleBookmark(event, '${art.id}')" title="Preferiti">⭐</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        loadAllNews();
        setInterval(loadAllNews, 60000);
    </script>
</body>
</html>
