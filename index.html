<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-title" content="NewsPaper">
    <meta name="theme-color" content="#030712">
    
    <title>NewsPaper 🐤 v15.0 - News & Deals</title>
    <link id="apple-icon" rel="apple-touch-icon" href="">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --surface-glass: rgba(15, 23, 42, 0.85);
            --surface-card: rgba(15, 23, 42, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #ccff00; /* Giallo acido */
            --primary-glow: rgba(204, 255, 0, 0.15);
            --brand-purple: #7c3aed;
            --brand-orange: #ff5400; /* Colore Instant Gaming */
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --nav-height: 46px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }

        input, .card-snippet { text-transform: none !important; }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* HEADER SUPER COMPATTO */
        .top-bar { 
            flex-shrink: 0;
            z-index: 800; 
            background: rgba(3, 7, 18, 0.92); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass); 
            padding: 6px 10px;
            padding-top: calc(env(safe-area-inset-top, 14px) + 3px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo { 
            background: linear-gradient(135deg, #8b5cf6, #6d28d9); 
            width: 32px; height: 32px; 
            border-radius: 9px; 
            display: grid; place-items: center; 
            font-size: 1rem; 
            flex-shrink: 0;
            box-shadow: 0 3px 12px rgba(139, 92, 246, 0.4); 
        }

        .search-box {
            position: relative;
            flex-grow: 1;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-glass);
            padding: 6px 10px 6px 32px;
            border-radius: 9px;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
            font-family: inherit;
        }
        .search-input:focus { border-color: rgba(204, 255, 0, 0.5); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 0.75rem; }

        .action-icon-btn {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 32px; height: 32px;
            border-radius: 9px;
            display: grid; place-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .action-icon-btn:active { transform: scale(0.9); }
        .action-icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .action-icon-btn.spinning svg { animation: spin 0.8s linear infinite; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .filter-badge-btn {
            background: var(--primary-glow);
            border: 1px solid rgba(204, 255, 0, 0.4);
            color: var(--primary);
            padding: 0 9px;
            height: 32px;
            border-radius: 9px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .filter-badge-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* CONTENUTO SCORRIBILE */
        .scrollable-content {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
            padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 12px) + 16px);
        }
