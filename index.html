<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060913">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toast-update" id="toast-update" onclick="applyPendingUpdates()" role="alert" aria-live="polite" style="display:none;">
        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>NUOVE NOTIZIE DISPONIBILI — CLICCA PER AGGIORNARE</span>
    </div>

    <div class="modal-overlay" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title" onclick="closeModalOnOverlay(event, 'search-modal')">
        <div class="modal-body" onclick="event.stopPropagation()">
            <div class="modal-title" id="search-modal-title">CERCA NEL GIORNALE</div>
            <div class="filter-group">
                <input type="text" id="search" class="modal-select" placeholder="SCRIVI E CERCA..." aria-label="Cerca notizie o offerte" oninput="debounceRender()">
            </div>
            <button class="modal-action-btn" aria-label="Conferma ricerca" onclick="toggleSearchModal(false)">CERCA</button>
        </div>
    </div>

    <div class="modal-overlay" id="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filter-modal-title" onclick="closeModalOnOverlay(event, 'filter-modal')">
        <div class="modal-body" onclick="event.stopPropagation()">
            <div class="modal-title" id="filter-modal-title">FILTRI PIATTAFORMA</div>
            <div class="filter-group">
                <select id="platform-filter" class="modal-select" aria-label="Seleziona piattaforma" onchange="render()">
                    <option value="ALL">TUTTE LE PIATTAFORME</option>
                    <option value="PC">PC / STEAM</option>
                    <option value="PLAYSTATION">PLAYSTATION</option>
                    <option value="XBOX">XBOX</option>
                    <option value="NINTENDO">NINTENDO SWITCH</option>
                </select>
            </div>
            <button class="modal-action-btn" aria-label="Applica filtri" onclick="toggleFilterModal(false)">APPLICA</button>
        </div>
    </div>

    <button class="arrow-nav prev" id="arrow-prev" aria-label="Pagina precedente" onclick="prevPage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="arrow-nav next" id="arrow-next" aria-label="Pagina successiva" onclick="nextPage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <main class="newspaper-viewport" id="viewport" aria-label="Lettore notizie">
        <div class="newspaper-track" id="newspaper-track">
            <div class="newspaper-page">
                <div class="page-paper empty-state">
                    <h1 class="page-title">CARICAMENTO...</h1>
                    <p class="page-desc">SCARICAMENTO CONTENUTI IN CORSO.</p>
                </div>
            </div>
        </div>
    </main>

    <div class="page-dots" id="page-dots" aria-label="Indicatori di pagina"></div>

    <button class="floating-action-btn filter-float-btn" id="float-filter-btn" aria-label="Apri filtri piattaforma" onclick="toggleFilterModal(true)" title="FILTRI" style="display:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    </button>
    
    <button class="floating-action-btn search-float-btn" aria-label="Apri ricerca nel giornale" onclick="toggleSearchModal(true)" title="CERCA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>

    <nav aria-label="Navigazione principale">
        <button class="nav-btn active" id="tab-news" aria-label="Sezione News" title="NEWS" onclick="switchTab('news')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8z"/></svg>
        </button>
        <button class="nav-btn" id="tab-deals" aria-label="Sezione Offerte" title="OFFERTE" onclick="switchTab('deals')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        </button>
        <button class="nav-btn" id="tab-saved" aria-label="Sezione Preferiti" title="PREFERITI" onclick="switchTab('saved')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
