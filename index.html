<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🐤</div>
        <input type="text" id="search" class="search" placeholder="CERCA NEL GIORNALE..." oninput="debounceRender()">
        <button class="btn-ui" id="filter-btn" onclick="toggleModal(true)">⚙️ FILTRI</button>
        <button class="btn-icon" id="refresh-btn" onclick="manualRefresh()" title="AGGIORNA">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14.93-4M20 12a8 8 0 0 1-14.93 4M14 8h5V3M10 16H5v5"/></svg>
        </button>
    </header>

    <div class="modal-overlay" id="filter-modal" onclick="closeModalOnOverlay(event)">
        <div class="modal-body">
            <div class="modal-title">PANNELLO FILTRI</div>
            
            <div class="filter-group">
                <label class="filter-label">FONTE NEWS</label>
                <select id="news-source-filter" class="modal-select" onchange="render()">
                    <option value="ALL">TUTTE LE FONTI</option>
                    <option value="IGN Italia">IGN ITALIA</option>
                    <option value="Multiplayer">MULTIPLAYER</option>
                    <option value="Everyeye">EVERYEYE</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">PIATTAFORMA OFFERTE</label>
                <select id="platform-filter" class="modal-select" onchange="render()">
                    <option value="ALL">TUTTE LE PIATTAFORME</option>
                    <option value="PC">PC / STEAM</option>
                    <option value="PS5">PLAYSTATION</option>
                    <option value="XBOX">XBOX</option>
                    <option value="SWITCH">NINTENDO SWITCH</option>
                </select>
            </div>

            <button class="btn-ui" style="justify-content:center; background:var(--primary); color:#fff; margin-top:6px;" onclick="toggleModal(false)">APPLICA FILTRI</button>
        </div>
    </div>

    <!-- Controlli di navigazione laterali per PC -->
    <button class="arrow-nav prev" id="arrow-prev" onclick="prevPage()">❮</button>
    <button class="arrow-nav next" id="arrow-next" onclick="nextPage()">❯</button>

    <main class="newspaper-viewport">
        <div class="newspaper-track" id="newspaper-track">
            <!-- Pagine caricate dinamicamente -->
        </div>
    </main>

    <div class="page-indicator" id="page-indicator">PAGINA 1 DI 1</div>

    <nav>
        <button class="nav-btn active" id="tab-news" onclick="switchTab('news')">📰 NEWS</button>
        <button class="nav-btn" id="tab-deals" onclick="switchTab('deals')">🏷️ OFFERTE</button>
        <button class="nav-btn" id="tab-saved" onclick="switchTab('saved')">⭐ PREFERITI</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
