<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --surface: #0f172a;
            --border: rgba(255, 255, 255, 0.1);
            --primary: #ccff00;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }
        body { background: var(--bg-base); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 12px; background: rgba(3,7,18,0.9); border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        .logo { background: #7c3aed; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-size: 1.2rem; }
        .search { flex-grow: 1; background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color: #fff; outline: none; }
        .btn-refresh { background: var(--surface); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }

        main { flex-grow: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 130px; object-fit: cover; background: #1e293b; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 0.85rem; font-weight: 800; margin-bottom: 6px; line-height: 1.2; }
        .card-desc { font-size: 0.75rem; color: var(--text-sub); text-transform: none !important; line-height: 1.3; margin-bottom: 8px; }
        .card-tag { font-size: 0.6rem; font-weight: 800; color: var(--primary); }

        nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.95); border: 1px solid var(--border); border-radius: 30px; padding: 4px; display: flex; gap: 6px; backdrop-filter: blur(10px); }
        .nav-btn { background: none; border: none; color: var(--text-sub); padding: 8px 16px; font-weight: 800; font-size: 0.7rem; border-radius: 20px; cursor: pointer; }
        .nav-btn.active { background: var(--primary); color: #000; }

        .error-box { text-align: center; grid-column: 1/-1; padding: 40px 20px; background: rgba(255,0,0,0.05); border: 1px dashed #ef4444; border-radius: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐤</div>
        <input type="text" id="search" class="search" placeholder="CERCA..." oninput="render()">
        <button class="btn-refresh" onclick="loadData()">🔄</button>
    </header>

    <main>
        <div class="grid" id="grid">
            <div style="text-align:center; grid-column:1/-1; padding:40px;">CARICAMENTO IN CORSO...</div>
        </div>
    </main>

    <nav>
        <button class="nav-btn active" id="tab-news" onclick="switchTab('news')">📰 NEWS</button>
        <button class="nav-btn" id="tab-deals" onclick="switchTab('deals')">🏷️ OFFERTE</button>
    </nav>

    <script>
        const FEEDS = [
            { name: "IGN Italia", url: "https://it.ign.com/feed.xml" },
            { name: "Multiplayer", url: "https://multiplayer.it/feed/rss/news/" }
        ];

        let articles = [];
        let deals = [];
        let currentTab = 'news';

        async function fetchProxy(url) {
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];
            for (let p of proxies) {
                try {
                    let r = await fetch(p);
                    if (r.ok) {
                        let text = await r.text();
                        if (text && text.includes("<rss")) return text;
                    }
                } catch(e) {}
            }
            return null;
        }

        function parseXML(xmlStr, source) {
            if (!xmlStr) return [];
            try {
                let xml = new DOMParser().parseFromString(xmlStr, "text/xml");
                return Array.from(xml.querySelectorAll("item")).map(i => ({
                    title: i.querySelector("title")?.textContent || "",
                    link: i.querySelector("link")?.textContent || "#",
                    desc: (i.querySelector("description")?.textContent || "").replace(/<[^>]*>?/gm, '').slice(0, 90) + "...",
                    source: source
                }));
            } catch(e) { return []; }
        }

        async function loadData() {
            document.getElementById('grid').innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:40px;">CARICAMENTO...</div>';
            
            articles = [];
            deals = [];

            // 1. Carica News
            for (let f of FEEDS) {
                let xml = await fetchProxy(f.url);
                if (xml) articles.push(...parseXML(xml, f.name));
            }

            // 2. Carica Instant Gaming
            let dealsXml = await fetchProxy("https://www.instant-gaming.com/it/feed/rss/");
            if (dealsXml) deals = parseXML(dealsXml, "Instant Gaming");

            render();
        }

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-news').classList.toggle('active', t === 'news');
            document.getElementById('tab-deals').classList.toggle('active', t === 'deals');
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            const q = document.getElementById('search').value.toLowerCase();
            const list = (currentTab === 'news' ? articles : deals).filter(i => i.title.toLowerCase().includes(q));

            grid.innerHTML = "";

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="error-box">
                        <p style="color:#ef4444; font-weight:800; margin-bottom:8px;">IMPOSSIBILE CARICARE I DATI LIVE</p>
                        <p style="font-size:0.7
