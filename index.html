<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --surface: #0f172a;
            --surface-card: #1e293b;
            --border: rgba(255, 255, 255, 0.1);
            --primary: #ccff00;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }
        
        body { 
            background: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            padding: 10px 14px; 
            background: rgba(3, 7, 18, 0.95); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            z-index: 100;
        }
        
        .logo { 
            background: #7c3aed; 
            width: 36px; height: 36px; 
            border-radius: 10px; 
            display: grid; 
            place-items: center; 
            font-size: 1.2rem; 
            flex-shrink: 0;
        }
        
        .search { 
            flex-grow: 1;
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            color: #fff; 
            outline: none; 
            font-size: 0.8rem;
        }

        .btn-ui {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0 12px;
            height: 36px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-ui.active { border-color: var(--primary); color: var(--primary); }

        .btn-icon { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: #fff; 
            width: 36px; height: 36px; 
            border-radius: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
            display: grid;
            place-items: center;
        }
        .btn-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }
        .btn-icon.spinning svg { animation: spin 0.8s linear infinite; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 300; display: none; align-items: center; justify-content: center;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal-body {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .modal-title { font-size: 0.9rem; font-weight: 800; color: var(--primary); }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-label { font-size: 0.7rem; color: var(--text-sub); font-weight: 800; }
        .modal-select {
            background: var(--bg-base); border: 1px solid var(--border);
            color: #fff; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 0.8rem;
        }

        main { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 12px; 
            padding-bottom: 90px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 12px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        .section-divider {
            grid-column: 1 / -1;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            overflow: hidden; 
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        .card-cover {
            width: 100%;
            height: 140px;
            background: var(--surface-card);
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-body { 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-tag { 
            font-size: 0.65rem; 
            font-weight: 800; 
            color: var(--primary); 
        }
        
        .star-btn {
            background: none; border: none; font-size: 1.1rem;
            cursor: pointer; padding: 2px; opacity: 0.3; transition: opacity 0.2s;
        }
        .star-btn.active { opacity: 1; }

        .card-title { 
            font-size: 0.85rem; 
            font-weight: 800; 
            margin-bottom: 6px; 
            line-height: 1.25; 
        }
        
        .card-desc { 
            font-size: 0.75rem; 
            color: var(--text-sub); 
            text-transform: none !important; 
            line-height: 1.35; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        nav { 
            position: fixed; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid var(--border); 
            border-radius: 30px; 
            padding: 4px; 
            display: flex; 
            gap: 4px; 
            backdrop-filter: blur(12px); 
            z-index: 200;
        }
        
        .nav-btn { 
            background: none; 
            border: none; 
            color: var(--text-sub); 
            padding: 8px 18px; 
            font-weight: 800; 
            font-size: 0.72rem; 
            border-radius: 20px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .nav-btn.active { 
            background: var(--primary); 
            color: #000; 
        }

        .status-box { 
            text-align: center; 
            grid-column: 1 / -1; 
            padding: 40px 20px; 
            color: var(--text-sub); 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐤</div>
        <input type="text" id="search" class="search" placeholder="CERCA..." oninput="render()">
        <button class="btn-ui" id="filter-btn" onclick="toggleModal(true)">⚙️ FILTRI</button>
        <button class="btn-icon" id="refresh-btn" onclick="manualRefresh()" title="AGGIORNA">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14.93-4M20 12a8 8 0 0 1-14.93 4M14 8h5V3M10 16H5v5"/></svg>
        </button>
    </header>

    <div class="modal-overlay" id="filter-modal">
        <div class="modal-body">
            <div class="modal-title">PANNELLO FILTRI</div>
            
            <div class="filter-group">
                <label class="filter-label">FONTE NEWS</label>
                <select id="news-source-filter" class="modal-select" onchange="render()">
                    <option value="ALL">TUTTE LE FONTI</option>
                    <option value="IGN Italia">IGN ITALIA</option>
                    <option value="Multiplayer">MULTIPLAYER</option>
                    <option value="Everyeye">EVERYEYE</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">PIATTAFORMA (OFFERTE INSTANT GAMING)</label>
                <select id="platform-filter" class="modal-select" onchange="render()">
                    <option value="ALL">TUTTE LE PIATTAFORME</option>
                    <option value="PC">PC / STEAM</option>
                    <option value="PS5">PLAYSTATION 5 / PS4</option>
                    <option value="XBOX">XBOX SERIES X|S / ONE</option>
                    <option value="SWITCH">NINTENDO SWITCH</option>
                </select>
            </div>

            <button class="btn-ui" style="justify-content:center; background:var(--primary); color:#000; margin-top:8px;" onclick="toggleModal(false)">APPLICA FILTRI</button>
        </div>
    </div>

    <main>
        <div class="grid" id="grid">
            <div class="status-box">CARICAMENTO IN CORSO...</div>
        </div>
    </main>

    <nav>
        <button class="nav-btn active" id="tab-news" onclick="switchTab('news')">📰 NEWS</button>
        <button class="nav-btn" id="tab-deals" onclick="switchTab('deals')">🏷️ OFFERTE</button>
        <button class="nav-btn" id="tab-saved" onclick="switchTab('saved')">⭐ PREFERITI</button>
    </nav>

    <script>
        const FEEDS = [
            { name: "IGN Italia", url: "https://it.ign.com/feed.xml" },
            { name: "Multiplayer", url: "https://multiplayer.it/feed/rss/news/" },
            { name: "Everyeye", url: "https://www.everyeye.it/feed/feed_news_rss.asp" }
        ];

        let articles = [];
        let deals = [];
        let savedItems = JSON.parse(localStorage.getItem('np_saved_items_v4') || '[]');
        let currentTab = 'news';

        function toggleModal(open) {
            document.getElementById('filter-modal').classList.toggle('open', open);
        }

        async function fetchFeedData(feedUrl) {
            const apiEndpoints = [
                `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`
            ];

            for (let endpoint of apiEndpoints) {
                try {
                    const res = await fetch(endpoint);
                    if (!res.ok) continue;

                    if (endpoint.includes('rss2json')) {
                        const data = await res.json();
                        if (data && data.status === 'ok' && data.items) {
                            return data.items.map(item => ({
                                id: item.link || item.guid,
                                title: item.title,
                                link: item.link,
                                desc: (item.description || '').replace(/<[^>]*>?/gm, '').slice(0, 95) + '...',
                                image: item.thumbnail || item.enclosure?.link || extractImageFromHtml(item.content || item.description),
                                rawContent: item.description
                            }));
                        }
                    } else {
                        const text = await res.text();
                        return parseXMLString(text);
                    }
                } catch (e) {
                    continue;
                }
            }
            return [];
        }

        function extractImageFromHtml(html) {
            if (!html) return null;
            const match = html.match(/src=["'](.*?\.(?:png|jpg|jpeg|webp|gif))["']/i);
            return match ? match[1] : null;
        }

        function parseXMLString(xmlStr) {
            try {
                const xml = new DOMParser().parseFromString(xmlStr, "text/xml");
                return Array.from(xml.querySelectorAll("item")).map(i => {
                    const link = (i.querySelector("link")?.textContent || "#").trim();
                    const title = (i.querySelector("title")?.textContent || "").replace(/<[^>]*>?/gm, '').trim();
                    const descRaw = i.querySelector("description")?.textContent || "";
                    const media = i.getElementsByTagName("media:content")[0] || i.getElementsByTagName("media:thumbnail")[0];
                    const enc = i.querySelector("enclosure");
                    
                    let img = media?.getAttribute("url") || enc?.getAttribute("url") || extractImageFromHtml(descRaw);

                    return {
                        id: link || title,
                        title: title,
                        link: link,
                        desc: descRaw.replace(/<[^>]*>?/gm, '').slice(0, 95) + "...",
                        image: img
                    };
                });
            } catch(e) {
                return [];
            }
        }

        async function loadData() {
            articles = [];
            deals = [];

            const newsTasks = FEEDS.map(async f => {
                const items = await fetchFeedData(f.url);
                return items.map(i => ({ ...i, source: f.name, type: 'news' }));
            });

            const dealsTask = (async () => {
                const items = await fetchFeedData("https://www.instant-gaming.com/it/feed/rss/");
                return items.map(i => ({ ...i, source: "Instant Gaming", type: 'deal' }));
            })();

            const results = await Promise.all([...newsTasks, dealsTask]);
            
            results.forEach((resSet, idx) => {
                if (idx < FEEDS.length) {
                    articles.push(...resSet);
                } else {
                    deals.push(...resSet);
                }
            });

            render();
        }

        async function manualRefresh() {
            const btn = document.getElementById('refresh-btn');
            btn.classList.add('spinning');
            await loadData();
            btn.classList.remove('spinning');
        }

        function toggleSave(e, id) {
            e.preventDefault();
            e.stopPropagation();

            const pool = [...articles, ...deals, ...savedItems];
            const item = pool.find(i => i.id === id);
            if (!item) return;

            const idx = savedItems.findIndex(i => i.id === id);
            if (idx > -1) {
                savedItems.splice(idx, 1);
            } else {
                savedItems.push(item);
            }

            localStorage.setItem('np_saved_items_v4', JSON.stringify(savedItems));
            render();
        }

        function switchTab(t) {
            currentTab = t;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            render();
        }

        function createCardElement(item) {
            const isSaved = savedItems.some(s => s.id === item.id);
            const card = document.createElement('a');
            card.className = 'card';
            card.href = item.link;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            
            const imageHTML = item.image ? `
                <div class="card-cover">
                    <img class="card-img" src="${item.image}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'">
                </div>
            ` : '';

            card.innerHTML = `
                ${imageHTML}
                <div class="card-body">
                    <div class="card-header">
                        <span class="card-tag">${item.source}</span>
                        <button class="star-btn ${isSaved ? 'active' : ''}" onclick="toggleSave(event, '${item.id.replace(/'/g, "\\'")}')">⭐</button>
                    </div>
                    <h2 class="card-title">${item.title}</h2>
                    <p class="card-desc">${item.desc}</p>
                </div>
            `;
            return card;
        }

        function render() {
            const grid = document.getElementById('grid');
            const q = document.getElementById('search').value.toLowerCase();
            const newsSource = document.getElementById('news-source-filter').value;
            const platformFilter = document.getElementById('platform-filter').value;
            
            grid.innerHTML = "";
            const fragment = document.createDocumentFragment();

            if (currentTab === 'saved') {
                const savedFiltered = savedItems.filter(i => {
                    return i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q);
                });

                if (savedFiltered.length === 0) {
                    grid.innerHTML = `<div class="status-box">NESSUN PREFERITO SALVATO.</div>`;
                    return;
                }

                const savedNewsList = savedFiltered.filter(i => i.type === 'news');
                const savedDealsList = savedFiltered.filter(i => i.type === 'deal');

                if (savedNewsList.length > 0) {
                    const div = document.createElement('div');
                    div.className = 'section-divider';
                    div.textContent = '📰 NEWS PREFERITE';
                    fragment.appendChild(div);
                    savedNewsList.forEach(item => fragment.appendChild(createCardElement(item)));
                }

                if (savedDealsList.length > 0) {
                    const div = document.createElement('div');
                    div.className = 'section-divider';
                    div.textContent = '🏷️ OFFERTE PREFERITE';
                    fragment.appendChild(div);
                    savedDealsList.forEach(item => fragment.appendChild(createCardElement(item)));
                }
                grid.appendChild(fragment);
                return;
            }

            let list = currentTab === 'news' ? articles : deals;

            const filtered = list.filter(i => {
                const matchesSearch = i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q);
                let matchesFilter = true;

                if (currentTab === 'news' && newsSource !== 'ALL') {
                    matchesFilter = i.source === newsSource;
                } else if (currentTab === 'deals' && platformFilter !== 'ALL') {
                    matchesFilter = i.title.toUpperCase().includes(platformFilter) || i.desc.toUpperCase().includes(platformFilter);
                }

                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="status-box">NESSUN ELEMENTO TROVATO.</div>`;
                return;
            }

            filtered.forEach(item => fragment.appendChild(createCardElement(item)));
            grid.appendChild(fragment);
        }

        loadData();
    </script>
</body>
</html>
