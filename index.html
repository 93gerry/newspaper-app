<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1d">
    <title>NewsPaper 🐤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🐤</div>
    </header>

    <div class="modal-overlay" id="search-modal" onclick="closeModalOnOverlay(event, 'search-modal')">
        <div class="modal-body">
            <div class="modal-title">CERCA NEL GIORNALE</div>
            <div class="filter-group">
                <input type="text" id="search" class="modal-select" placeholder="SCRIVI E CERCA..." oninput="debounceRender()">
            </div>
            <button class="btn-ui" style="justify-content:center; background:var(--primary); color:#fff; margin-top:6px;" onclick="toggleSearchModal(false)">CHIUDI</button>
        </div>
    </div>

    <div class="modal-overlay" id="filter-modal" onclick="closeModalOnOverlay(event, 'filter-modal')">
        <div class="modal-body">
            <div class="modal-title">FILTRI</div>
            <div class="filter-group">
                <label class="filter-label">PIATTAFORMA</label>
                <select id="platform-filter" class="modal-select" onchange="render()">
                    <option value="ALL">TUTTE LE PIATTAFORME</option>
                    <option value="PC">PC / STEAM</option>
                    <option value="PLAYSTATION">PLAYSTATION</option>
                    <option value="XBOX">XBOX</option>
                    <option value="NINTENDO">NINTENDO SWITCH</option>
                </select>
            </div>
            <button class="btn-ui" style="justify-content:center; background:var(--primary); color:#fff; margin-top:6px;" onclick="toggleFilterModal(false)">APPLICA</button>
        </div>
    </div>

    <button class="arrow-nav prev" id="arrow-prev" onclick="prevPage()">❮</button>
    <button class="arrow-nav next" id="arrow-next" onclick="nextPage()">❯</button>

    <main class="newspaper-viewport" id="viewport">
        <div class="newspaper-track" id="newspaper-track">
            <div class="newspaper-page">
                <div class="page-paper empty-state">
                    <h1 class="page-title">CARICAMENTO...</h1>
                    <p class="page-desc">SCARICAMENTO CONTENUTI IN CORSO.</p>
                </div>
            </div>
        </div>
    </main>

    <div class="page-dots" id="page-dots"></div>

    <button class="floating-action-btn filter-float-btn" id="float-filter-btn" onclick="toggleFilterModal(true)" title="FILTRI" style="display:none;">⚙️</button>
    <button class="floating-action-btn search-float-btn" onclick="toggleSearchModal(true)" title="CERCA">🔍</button>

    <nav>
        <button class="nav-btn active" id="tab-news" onclick="switchTab('news')" title="NEWS">📰</button>
        <button class="nav-btn" id="tab-deals" onclick="switchTab('deals')" title="OFFERTE">🏷️</button>
        <button class="nav-btn" id="tab-saved" onclick="switchTab('saved')" title="PREFERITI">⭐</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
